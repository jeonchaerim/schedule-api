spring:
  application:
    name: schedule-api
  profiles:
    active: local   # docker-compose에서 SPRING_PROFILES_ACTIVE=docker로 덮어씀
  jpa:
    properties:
      hibernate:
        format_sql: true
    open-in-view: true   # N+1 재현 비교를 위해 의도적으로 유지

logging:
  level:
    org.hibernate.SQL: debug # SQL 문 자체 (바인딩 값은 없음 — profile별 로깅은 각 파일 참고)
