# 멀티 인스턴스 부하 테스트 전용 compose (기존 루트 docker-compose.yml과 분리)
# - app을 --scale로 N개 띄우고, nginx가 라운드로빈으로 분배
# - 루트 compose와 포트/컨테이너명이 겹치지 않게 호스트 포트는 nginx(8088)만 연다
name: schedule-loadtest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schedule
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule -d schedule"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
    # container_name / ports 고정 금지 — 고정하면 --scale로 여러 개를 못 띄움
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: schedule
      DB_USERNAME: schedule
      DB_PASSWORD: schedule
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 인스턴스 N개 x 풀 크기가 Postgres max_connections(기본 100)를 넘지 않게 제한 (10개 x 5 = 50)
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      # SQL 디버그 로그가 요청마다 쏟아지면 측정값이 왜곡되므로 끔
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: warn
      # JVM 1개당 메모리를 실험 변수로 열어둠 (실행 시 APP_JAVA_OPTS로 덮어쓰기, 기본은 힙 256MB)
      JAVA_TOOL_OPTIONS: "${APP_JAVA_OPTS:--Xmx256m}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8088:80"
    depends_on:
      - app
