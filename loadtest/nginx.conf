events {}

http {
    # 어느 인스턴스(upstream)가 요청을 처리했는지, 걸린 시간이 얼마인지 로그에 남김
    log_format lb '$request $status rt=$request_time upstream=$upstream_addr urt=$upstream_response_time';
    access_log /dev/stdout lb;

    # "app"은 docker DNS가 scale된 컨테이너 IP 전부로 풀어줌 → nginx가 라운드로빈으로 분배
    # (nginx는 시작 시점에 한 번만 resolve하므로, app을 전부 띄운 뒤에 nginx를 (재)시작해야 함)
    # max_fails=0: 느린 응답이 한 번 나왔다고 그 서버를 통째로 제외하지 않음
    # (제외되면 이후 요청이 전부 502가 되어 측정이 무의미해짐)
    upstream app-pool {
        server app:8080 max_fails=0;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app-pool;
            proxy_read_timeout 180s;   # 기본 60초 — 콜드 JVM의 첫 요청이 느려도 끊지 않음
            # 응답 헤더로 처리한 인스턴스 주소를 알려줌 → 부하 스크립트가 분산 여부를 집계
            add_header X-Upstream $upstream_addr always;
        }
    }
}
