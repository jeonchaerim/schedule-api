name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin   # Dockerfile과 동일 벤더로 통일
          java-version: '17'      # build.gradle의 toolchain 버전과 일치
          cache: gradle           # Gradle 의존성 캐시 재사용 (매번 새로 다운로드하지 않도록)

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew   # 체크아웃 직후엔 gradlew에 실행 권한이 없을 수 있음

      - name: Build and test
        run: ./gradlew build --no-daemon   # build가 test를 포함 — 테스트 실패 시 이 step이 실패 처리됨

      - name: Upload test report
        if: always()   # 테스트가 실패해도 리포트는 남겨서 원인 확인 가능하게
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 14   # 14일 후 자동 삭제 (계속 쌓이지 않도록)

  # CD: build가 성공한 뒤에만 실행, 그것도 push일 때만 (PR에서는 이미지 안 올림)
  deploy:
    needs: build
    if: success() && github.event_name == 'push'   # success() 명시 — 커스텀 if가 needs의 기본 성공 게이트를 대체하는 것을 방지
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # ghcr.io에 이미지 올리려면 필요한 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub이 매 실행마다 자동으로 발급해주는 토큰

      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        # Docker 레지스트리는 이미지 이름이 소문자여야 함 — github.repository는 계정명 대소문자를 그대로 보존하므로 강제 변환

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max   # GitHub Actions 캐시로 레이어 재사용 (매번 처음부터 빌드하지 않도록)
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
