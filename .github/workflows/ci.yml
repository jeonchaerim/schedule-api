name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin   # Dockerfile과 동일 벤더로 통일
          java-version: '17'      # build.gradle의 toolchain 버전과 일치
          cache: gradle           # Gradle 의존성 캐시 재사용 (매번 새로 다운로드하지 않도록)

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew   # 체크아웃 직후엔 gradlew에 실행 권한이 없을 수 있음

      - name: Build and test
        run: ./gradlew build --no-daemon   # build가 test를 포함 — 테스트 실패 시 이 step이 실패 처리됨

      - name: Upload test report
        if: always()   # 테스트가 실패해도 리포트는 남겨서 원인 확인 가능하게
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 14   # 14일 후 자동 삭제 (계속 쌓이지 않도록)
